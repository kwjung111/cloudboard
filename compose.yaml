services:
  cloudboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
    image: cloudboard:local
    container_name: cloudboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CLOUDBOARD_ENVIRONMENTS_FILE: /app/config/environments.json
    volumes:
      - ./config/environments.json:/app/config/environments.json:ro
      - ./credentials:/run/cloudboard-credentials:ro
    secrets:
      - aws_dev_credentials
      - aws_prd_credentials

secrets:
  aws_dev_credentials:
    file: ./dev-readonly_accessKeys.csv
  aws_prd_credentials:
    file: ./prd-readonly_accessKeys.csv
