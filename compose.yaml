services:
  cloudboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
    image: cloudboard:local
    container_name: cloudboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CLOUDBOARD_DATABASE_PATH: /app/data/cloudboard.db
      CLOUDBOARD_ENVIRONMENTS_BOOTSTRAP_FILE: /app/config/environments.json
      CLOUDBOARD_CREDENTIALS_DIR: /run/cloudboard-credentials
      CLOUDBOARD_DYNAMIC_CREDENTIALS_DIR: /run/cloudboard-dynamic-credentials
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDBOARD_AI_MODEL: ${CLOUDBOARD_AI_MODEL:-gpt-5.6-sol}
      CLOUDBOARD_AI_AUDIT_MAX_TOOL_CALLS: ${CLOUDBOARD_AI_AUDIT_MAX_TOOL_CALLS:-16}
      CLOUDBOARD_AI_AUDIT_MIN_INTERVAL_SECONDS: ${CLOUDBOARD_AI_AUDIT_MIN_INTERVAL_SECONDS:-300}
      CLOUDBOARD_AI_AUDIT_TIMEOUT_MS: ${CLOUDBOARD_AI_AUDIT_TIMEOUT_MS:-210000}
    volumes:
      - cloudboard-data:/app/data
      - ./credentials:/run/cloudboard-dynamic-credentials:ro
      - ./dev-readonly_accessKeys.csv:/run/cloudboard-credentials/dev.csv:ro
      - ./prd-readonly_accessKeys.csv:/run/cloudboard-credentials/prd.csv:ro

  cloudboard-reporter:
    image: cloudboard:local
    container_name: cloudboard-reporter
    restart: unless-stopped
    command: ["node", "worker/daily-cost-scheduler.mjs"]
    depends_on:
      cloudboard:
        condition: service_healthy
    environment:
      CLOUDBOARD_DAILY_REPORT_URL: http://cloudboard:3000/api/reports/daily-cost
      CLOUDBOARD_DAILY_REPORT_RUN_ON_START: "true"
      CLOUDBOARD_AI_AUDIT_ENABLED: ${CLOUDBOARD_AI_AUDIT_ENABLED:-false}
      CLOUDBOARD_AI_AUDIT_URL: http://cloudboard:3000/api/reports/ai-audit
      CLOUDBOARD_REPORT_TIMEOUT_MS: ${CLOUDBOARD_REPORT_TIMEOUT_MS:-330000}

volumes:
  cloudboard-data:
